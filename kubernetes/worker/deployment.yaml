apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-worker
  labels:
    app: sre-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-worker
  template:
    metadata:
      labels:
        app: sre-worker
    spec:
      containers:
        - name: worker
          image: enterprise-sre-worker:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672
            - name: RABBITMQ_QUEUE
              value: sre-jobs